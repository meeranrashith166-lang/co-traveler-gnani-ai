<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <!-- Smooth Saffron to Amber Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#EA580C"/>
    </linearGradient>

    <!-- Clean Emerald Accent -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- Clean Rounded Square Container (iOS / Android App Icon Style) -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="#0F172A" stroke="#1E293B" stroke-width="2.5"/>

  <!-- Minimalist Highway Road Perspective -->
  <path d="M42 96 L54 48 L66 48 L78 96 Z" fill="#1E293B"/>

  <!-- Clean Dashed Center Highway Marking -->
  <line x1="60" y1="52" x2="60" y2="62" stroke="#FDE047" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="70" x2="60" y2="82" stroke="#FDE047" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="89" x2="60" y2="96" stroke="#FDE047" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Minimalist "C" Arc / Highway Horizon Loop (Saffron Ribbon) -->
  <path d="M86 36 C78 26, 62 24, 50 28 C36 34, 26 48, 26 64 C26 80, 36 94, 52 98" 
        fill="none" 
        stroke="url(#primaryGrad)" 
        stroke-width="7" 
        stroke-linecap="round"/>

  <!-- Voice Soundwave Pulse (3 Minimalist Clean Bars) -->
  <rect x="80" y="58" width="4" height="14" rx="2" fill="url(#accentGrad)"/>
  <rect x="88" y="50" width="4" height="30" rx="2" fill="url(#primaryGrad)"/>
  <rect x="96" y="62" width="4" height="10" rx="2" fill="url(#accentGrad)"/>

  <!-- GPS Navigator Horizon Beacon Dot -->
  <circle cx="60" cy="40" r="5" fill="#F59E0B"/>
  <circle cx="60" cy="40" r="2.5" fill="#FFFFFF"/>
</svg>
